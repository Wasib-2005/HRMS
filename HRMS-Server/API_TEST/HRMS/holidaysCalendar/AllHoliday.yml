info:
  name: AllHoliday
  type: http
  seq: 1

http:
  method: GET
  url: http://localhost:5000/api/holiday?year=2026&month=12
  params:
    - name: year
      value: "2026"
      type: query
    - name: month
      value: "12"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
