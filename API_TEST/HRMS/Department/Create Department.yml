info:
  name: Create Department
  type: http
  seq: 4

http:
  method: POST
  url: http://localhost:5000/api/departments
  body:
    type: json
    data: |-
      {
        "name": "Engineering",
        "description": "Software Development & Infrastructure",
        "status": "active"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
